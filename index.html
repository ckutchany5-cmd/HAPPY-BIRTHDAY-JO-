<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Jovial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,#153677,#090b1d 45%,#02040a 100%);
font-family:Poppins,sans-serif;
color:white;
position:relative;
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{

0%{opacity:.2;transform:scale(.8);}
50%{opacity:1;transform:scale(1.3);}
100%{opacity:.2;transform:scale(.8);}

}

.container{

text-align:center;
z-index:5;
padding:30px;

animation:fade 2s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(25px);
}

to{

opacity:1;
transform:translateY(0);

}

}

h2{

font-weight:300;
margin-bottom:12px;
font-size:22px;
opacity:.9;

}

h1{

font-family:"Playfair Display",serif;
font-size:65px;
letter-spacing:4px;
margin:30px 0 10px;

text-shadow:
0 0 20px #4f9dff,
0 0 45px #4f9dff;

}

small{

font-size:18px;
letter-spacing:3px;
opacity:.8;

}

p{

margin-top:30px;
font-size:20px;
opacity:.85;

}

button{

display:none;

margin:55px auto 0;

padding:20px 60px;

border:none;

border-radius:60px;

background:white;

color:#1c4ca8;

font-size:22px;

font-weight:600;

cursor:pointer;

box-shadow:0 0 35px rgba(255,255,255,.7);

animation:pulse 2s infinite;

transition:.4s;

}

button:hover{

transform:scale(1.08);

}

@keyframes pulse{

0%{transform:scale(1);}

50%{transform:scale(1.05);}

100%{transform:scale(1);}

}
.footer{

position:absolute;

bottom:25px;

width:100%;

text-align:center;

opacity:.45;

font-size:15px;

}

</style>

</head>

<body>

<script>

for(let i=0;i<220;i++){

let s=document.createElement("div");

s.className="star";

let size=Math.random()*3+1;

s.style.width=size+"px";

s.style.height=size+"px";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.animationDelay=Math.random()*4+"s";

document.body.appendChild(s);

}

</script>

<div class="container">

<h2>Il y a des personnes...</h2>

<h2>qui entrent dans notre vie...</h2>

<h2>et qui la changent sans même s'en rendre compte.</h2>

<h1>JOVIAL</h1>

<small>MUNDHU MULUKA</small>

<p>by Consolate Kutchany Kanku ( mama lova❤️).</p>

<button>✨ Commencer</button>

</div>

<div class="footer">

Chaque étoile raconte une histoire.

</div>

</body>
</html>
